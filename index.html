<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ランニング継続カレンダー</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --sky-50: #f3fbff;
      --sky-100: #eaf7ff;
      --sky-150: #dff3fd;
      --sky-200: #d6f1ff;
      --sky-300: #b9e2f7;
      --sky-500: #38a9dd;
      --sky-600: #2da5dd;
      --sky-700: #2385ba;
      --ink: #193653;
      --muted: #60839a;
      --white: #ffffff;
      --flower: #ee6286;
      --flower-bg: #fff2f6;
      --rain: #2772b8;
      --hospital: #d95164;
      --work: #2f8f68;
    }

    body {
      min-height: 100vh;
      background: var(--sky-100);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif;
    }

    header {
      background: var(--sky-200);
      border-bottom: 1px solid var(--sky-300);
      padding: 22px 18px 19px;
      text-align: center;
    }

    h1 {
      color: #174a73;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 7px;
    }

    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px 12px 28px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat {
      background: var(--white);
      border: 1px solid #caeaf9;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(33, 111, 156, 0.08);
      padding: 13px 10px;
      text-align: center;
    }

    .stat-value {
      color: var(--sky-700);
      font-size: 1.65rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.76rem;
      margin-top: 5px;
    }

    .calendar-card {
      background: var(--white);
      border: 1px solid #caeaf9;
      border-radius: 18px;
      box-shadow: 0 5px 18px rgba(33, 111, 156, 0.1);
      padding: 14px 10px 13px;
    }

    .calendar-header {
      align-items: center;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .month-nav {
      align-items: center;
      display: flex;
      gap: 5px;
    }

    button {
      border: none;
      cursor: pointer;
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-button {
      align-items: center;
      background: #e0f4fd;
      border-radius: 10px;
      color: #276385;
      display: inline-flex;
      height: 38px;
      justify-content: center;
      width: 38px;
    }

    .month-label {
      background: transparent;
      border-radius: 10px;
      color: #174a73;
      font-size: 1.06rem;
      font-weight: 700;
      min-width: 126px;
      padding: 8px 5px;
      text-align: center;
    }

    .today-button {
      background: #e0f4fd;
      border-radius: 18px;
      color: #276385;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 8px 12px;
    }

    .mode-picker {
      background: var(--sky-50);
      border: 1px solid #caeaf9;
      border-radius: 13px;
      display: grid;
      gap: 5px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 12px;
      padding: 5px;
    }

    .mode-button {
      align-items: center;
      background: transparent;
      border-radius: 9px;
      color: #276385;
      display: flex;
      font-size: 0.82rem;
      font-weight: 700;
      gap: 5px;
      justify-content: center;
      min-width: 0;
      min-height: 36px;
      padding: 7px 5px;
      white-space: nowrap;
    }

    .mode-button .mode-icon {
      font-size: 1.05rem;
      line-height: 1;
    }

    .mode-button.active {
      background: var(--white);
      box-shadow: 0 2px 8px rgba(35, 133, 186, 0.13);
      color: #174a73;
    }

    .nav-button:active,
    .month-label:active,
    .today-button:active,
    .mode-button:active {
      background: #ccecfb;
    }

    .weekdays,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
    }

    .weekdays {
      color: var(--muted);
      font-size: 0.74rem;
      margin-bottom: 5px;
      text-align: center;
    }

    .weekdays .sun {
      color: #e15c7a;
    }

    .weekdays .sat {
      color: var(--sky-700);
    }

    .calendar-day {
      align-items: center;
      background: var(--sky-50);
      border: 1px solid #d2eaf6;
      border-radius: 11px;
      color: #345773;
      display: flex;
      flex-direction: column;
      gap: 2px;
      height: 66px;
      justify-content: flex-start;
      padding: 5px 2px 3px;
      position: relative;
      width: 100%;
    }

    .calendar-day:active:not(.future) {
      background: #e3f5fd;
    }

    .calendar-day.blank {
      background: transparent;
      border-color: transparent;
      cursor: default;
    }

    .calendar-day.today {
      border: 2px solid var(--sky-500);
      padding-top: 4px;
    }

    .calendar-day.completed {
      background: var(--flower-bg);
      border-color: #f2cbd5;
    }

    .calendar-day.future {
      color: #a4bccb;
      cursor: default;
      opacity: 0.68;
    }

    .calendar-day.sun .day-number {
      color: #e15c7a;
    }

    .calendar-day.sat .day-number {
      color: var(--sky-700);
    }

    .day-number {
      align-self: flex-end;
      font-size: 0.76rem;
      line-height: 1;
      margin-right: 5px;
    }

    .hanamaru {
      color: var(--flower);
      display: block;
      font-size: 1.35rem;
      line-height: 1;
      min-height: 1.35rem;
      transform: scale(0);
      transition: transform 0.16s ease;
    }

    .calendar-day.completed .hanamaru {
      transform: scale(1);
    }

    .daily-marks {
      align-items: center;
      display: flex;
      gap: 2px;
      justify-content: center;
      min-height: 1rem;
      width: 100%;
    }

    .daily-mark {
      display: inline-flex;
      font-size: 0.86rem;
      line-height: 1;
      transform: scale(0);
      transition: transform 0.16s ease;
    }

    .calendar-day.rainy .rain-mark,
    .calendar-day.sick .hospital-mark,
    .calendar-day.working .work-mark {
      transform: scale(1);
    }

    .rain-mark {
      color: var(--rain);
    }

    .hospital-mark {
      color: var(--hospital);
    }

    .work-mark {
      color: var(--work);
    }

    .hint {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.55;
      margin-top: 13px;
      text-align: center;
    }

    .today-action {
      background: var(--sky-600);
      border-radius: 13px;
      color: #fff;
      display: block;
      font-size: 0.98rem;
      font-weight: 700;
      margin: 15px auto 0;
      padding: 13px 16px;
      width: 100%;
    }

    .today-action.done {
      background: #ef7793;
    }

    .today-action.rain {
      background: #317fbd;
    }

    .today-action.hospital {
      background: #d95164;
    }

    .today-action.work {
      background: #2f8f68;
    }

    .today-action:active {
      filter: brightness(0.96);
    }

    .message {
      color: var(--sky-700);
      font-size: 0.84rem;
      font-weight: 600;
      min-height: 1.3em;
      margin-top: 10px;
      text-align: center;
    }

    @media (max-width: 360px) {
      main {
        padding-left: 8px;
        padding-right: 8px;
      }

      .calendar-card {
        padding-left: 7px;
        padding-right: 7px;
      }

      .calendar-grid,
      .weekdays {
        gap: 3px;
      }

      .calendar-day {
        height: 61px;
      }

      .hanamaru {
        font-size: 1.22rem;
        min-height: 1.22rem;
      }

      .mode-button {
        font-size: 0.76rem;
        gap: 3px;
      }

      .month-label {
        min-width: 112px;
        font-size: 0.98rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>ランニング継続カレンダー</h1>
    <p class="subtitle">走れた日、雨の日、体調不良の日を残せます</p>
  </header>

  <main>
    <section class="stats" aria-label="継続状況">
      <div class="stat">
        <div class="stat-value" id="stat-month">0</div>
        <div class="stat-label">今月の花丸</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-streak">0</div>
        <div class="stat-label">連続達成日数</div>
      </div>
    </section>

    <section class="calendar-card">
      <div class="calendar-header">
        <div class="month-nav">
          <button type="button" class="nav-button" id="prev-month" aria-label="前の月">&lsaquo;</button>
          <button type="button" class="month-label" id="month-label" aria-label="今月に戻る"></button>
          <button type="button" class="nav-button" id="next-month" aria-label="次の月">&rsaquo;</button>
        </div>
        <button type="button" class="today-button" id="go-today">今日</button>
      </div>

      <div class="mode-picker" aria-label="付けるマーク">
        <button type="button" class="mode-button active" data-mode="run">
          <span class="mode-icon" aria-hidden="true">◎</span><span>走った</span>
        </button>
        <button type="button" class="mode-button" data-mode="rain">
          <span class="mode-icon" aria-hidden="true">☔</span><span>雨</span>
        </button>
        <button type="button" class="mode-button" data-mode="hospital">
          <span class="mode-icon" aria-hidden="true">🏥</span><span>病院</span>
        </button>
        <button type="button" class="mode-button" data-mode="work">
          <span class="mode-icon" aria-hidden="true">💼</span><span>出勤</span>
        </button>
      </div>

      <div class="weekdays" aria-hidden="true">
        <span class="sun">日</span><span>月</span><span>火</span><span>水</span>
        <span>木</span><span>金</span><span class="sat">土</span>
      </div>
      <div id="calendar-grid" class="calendar-grid"></div>

      <button type="button" class="today-action" id="today-action">今日、走った◎を付ける</button>
      <p class="hint">上のマークを選んでから、カレンダーの日付をタップしてください。</p>
      <p class="message" id="message" aria-live="polite"></p>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script>
    const MARKS_KEY = 'running_log_checkins';
    const DETAIL_KEY = 'running_log_daily_marks';
    const LEGACY_KEY = 'running_log_data';
    const firebaseConfig = {
      apiKey: "AIzaSyCfvqQWLB8NJqmaH0k2G0wPcbJJjz2Vu4A",
      authDomain: "kaimemo-58bad.firebaseapp.com",
      projectId: "kaimemo-58bad",
      storageBucket: "kaimemo-58bad.firebasestorage.app",
      messagingSenderId: "308069117698",
      appId: "1:308069117698:web:c61a57853abb7e8ffb1c1b"
    };
    const emptyState = () => ({ run: [], rain: [], hospital: [], work: [] });
    let docRef = null;
    let state = emptyState();
    let remoteReady = false;
    const today = new Date();
    const todayValue = formatDate(today);
    const modeLabels = {
      run: { name: '走った', icon: '◎', add: '花丸を付けました', remove: '花丸を外しました' },
      rain: { name: '雨', icon: '☔', add: '雨マークを付けました', remove: '雨マークを外しました' },
      hospital: { name: '体調不良', icon: '🏥', add: '病院マークを付けました', remove: '病院マークを外しました' },
      work: { name: '出勤', icon: '💼', add: '出勤マークを付けました', remove: '出勤マークを外しました' }
    };
    let viewYear = today.getFullYear();
    let viewMonth = today.getMonth();
    let activeMode = 'run';
    let messageTimer;

    function pad(value) {
      return String(value).padStart(2, '0');
    }

    function formatDate(date) {
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function normalizeMarks(value) {
      return [...new Set(Array.isArray(value) ? value.filter(Boolean) : [])].sort();
    }

    function normalizeState(value = {}) {
      return {
        run: normalizeMarks(value.run),
        rain: normalizeMarks(value.rain),
        hospital: normalizeMarks(value.hospital),
        work: normalizeMarks(value.work)
      };
    }

    function loadLegacyRuns() {
      try {
        const legacyRuns = JSON.parse(localStorage.getItem(LEGACY_KEY) || '[]');
        return normalizeMarks(legacyRuns.map(run => run.date));
      } catch (error) {
        return [];
      }
    }

    function loadRunMarks() {
      const saved = localStorage.getItem(MARKS_KEY);
      if (saved) {
        try {
          return normalizeMarks(JSON.parse(saved));
        } catch (error) {
          return [];
        }
      }

      const imported = loadLegacyRuns();
      saveRunMarks(imported);
      return imported;
    }

    function saveRunMarks(marks) {
      localStorage.setItem(MARKS_KEY, JSON.stringify(normalizeMarks(marks)));
    }

    function emptyDetails() {
      return {
        rain: [],
        hospital: [],
        work: []
      };
    }

    function loadDetails() {
      const saved = localStorage.getItem(DETAIL_KEY);
      if (!saved) return emptyDetails();

      try {
        const parsed = JSON.parse(saved);
        return {
          rain: normalizeMarks(parsed.rain),
          hospital: normalizeMarks(parsed.hospital),
          work: normalizeMarks(parsed.work)
        };
      } catch (error) {
        return emptyDetails();
      }
    }

    function saveDetails(details) {
      localStorage.setItem(DETAIL_KEY, JSON.stringify({
        rain: normalizeMarks(details.rain),
        hospital: normalizeMarks(details.hospital),
        work: normalizeMarks(details.work)
      }));
    }

    function loadLocalState() {
      return {
        run: loadRunMarks(),
        ...loadDetails()
      };
    }

    function hasAnyMarks(value) {
      return ['run', 'rain', 'hospital', 'work'].some(key => Array.isArray(value[key]) && value[key].length > 0);
    }

    function saveLocalState(nextState) {
      saveRunMarks(nextState.run);
      saveDetails(nextState);
    }

    function saveState(nextState) {
      state = normalizeState(nextState);
      saveLocalState(state);

      if (!docRef) return;

      docRef.set({
        run: state.run,
        rain: state.rain,
        hospital: state.hospital,
        work: state.work,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }).catch(error => {
        console.error('Firestore save failed:', error);
      });
    }

    function showMessage(text) {
      const message = document.getElementById('message');
      clearTimeout(messageTimer);
      message.textContent = text;
      messageTimer = setTimeout(() => {
        message.textContent = '';
      }, 1800);
    }

    function toggleInList(list, dateValue) {
      const next = [...list];
      const index = next.indexOf(dateValue);
      const added = index === -1;

      if (added) {
        next.push(dateValue);
      } else {
        next.splice(index, 1);
      }

      return {
        added,
        values: normalizeMarks(next)
      };
    }

    function toggleMark(dateValue) {
      if (dateValue > todayValue) return;
      const result = toggleInList(state[activeMode], dateValue);
      state[activeMode] = result.values;

      saveState(state);
      render();
      showMessage(modeLabels[activeMode][result.added ? 'add' : 'remove']);
    }

    function getStreak(marks) {
      const marked = new Set(marks);
      const cursor = new Date(today);
      if (!marked.has(todayValue)) {
        cursor.setDate(cursor.getDate() - 1);
      }

      let streak = 0;
      while (marked.has(formatDate(cursor))) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      }
      return streak;
    }

    function renderStats(state) {
      const monthPrefix = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-`;
      document.getElementById('stat-month').textContent =
        state.run.filter(date => date.startsWith(monthPrefix)).length;
      document.getElementById('stat-streak').textContent = getStreak(state.run);
    }

    function describeDay(dateValue, month, day, state) {
      const labels = [];
      if (state.run.includes(dateValue)) labels.push('走った');
      if (state.rain.includes(dateValue)) labels.push('雨');
      if (state.hospital.includes(dateValue)) labels.push('体調不良');
      if (state.work.includes(dateValue)) labels.push('出勤');

      const status = labels.length ? `。記録済み: ${labels.join('、')}` : '';
      return `${month + 1}月${day}日${status}。タップで${modeLabels[activeMode].name}マークを切り替え`;
    }

    function renderCalendar(state) {
      const marked = new Set(state.run);
      const rain = new Set(state.rain);
      const hospital = new Set(state.hospital);
      const work = new Set(state.work);
      const grid = document.getElementById('calendar-grid');
      const firstDay = new Date(viewYear, viewMonth, 1).getDay();
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      grid.innerHTML = '';
      document.getElementById('month-label').textContent = `${viewYear}年 ${viewMonth + 1}月`;

      for (let blank = 0; blank < firstDay; blank++) {
        const space = document.createElement('span');
        space.className = 'calendar-day blank';
        grid.appendChild(space);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(viewYear, viewMonth, day);
        const dateValue = formatDate(date);
        const weekday = date.getDay();
        const completed = marked.has(dateValue);
        const rainy = rain.has(dateValue);
        const sick = hospital.has(dateValue);
        const working = work.has(dateValue);
        const future = dateValue > todayValue;
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'calendar-day'
          + (weekday === 0 ? ' sun' : weekday === 6 ? ' sat' : '')
          + (dateValue === todayValue ? ' today' : '')
          + (completed ? ' completed' : '')
          + (rainy ? ' rainy' : '')
          + (sick ? ' sick' : '')
          + (working ? ' working' : '')
          + (future ? ' future' : '');
        cell.disabled = future;
        cell.setAttribute('aria-label', describeDay(dateValue, viewMonth, day, state));
        cell.innerHTML = `
          <span class="day-number">${day}</span>
          <span class="hanamaru" aria-hidden="true">◎</span>
          <span class="daily-marks" aria-hidden="true">
            <span class="daily-mark rain-mark">☔</span>
            <span class="daily-mark hospital-mark">🏥</span>
            <span class="daily-mark work-mark">💼</span>
          </span>
        `;
        cell.addEventListener('click', () => toggleMark(dateValue));
        grid.appendChild(cell);
      }
    }

    function renderModeButtons() {
      document.querySelectorAll('.mode-button').forEach(button => {
        button.classList.toggle('active', button.dataset.mode === activeMode);
      });
    }

    function renderTodayButton(state) {
      const button = document.getElementById('today-action');
      const active = state[activeMode].includes(todayValue);
      const label = modeLabels[activeMode];

      button.classList.toggle('done', activeMode === 'run' && active);
      button.classList.toggle('rain', activeMode === 'rain');
      button.classList.toggle('hospital', activeMode === 'hospital');
      button.classList.toggle('work', activeMode === 'work');
      button.textContent = active
        ? `今日の${label.name}${label.icon}を外す`
        : `今日、${label.name}${label.icon}を付ける`;
    }

    function render() {
      renderStats(state);
      renderModeButtons();
      renderCalendar(state);
      renderTodayButton(state);
    }

    function initializeRemoteSync() {
      if (!window.firebase) return;

      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }

        docRef = firebase.firestore().collection('data').doc('running-log');
        docRef.onSnapshot(snapshot => {
          const remoteState = snapshot.exists ? normalizeState(snapshot.data()) : emptyState();

          if (!remoteReady && !hasAnyMarks(remoteState) && hasAnyMarks(state)) {
            remoteReady = true;
            saveState(state);
            return;
          }

          remoteReady = true;
          state = remoteState;
          saveLocalState(state);
          render();
        }, error => {
          console.error('Firestore sync failed:', error);
        });
      } catch (error) {
        console.error('Firebase initialization failed:', error);
      }
    }

    document.getElementById('prev-month').addEventListener('click', () => {
      viewMonth--;
      if (viewMonth < 0) {
        viewMonth = 11;
        viewYear--;
      }
      render();
    });

    document.getElementById('next-month').addEventListener('click', () => {
      viewMonth++;
      if (viewMonth > 11) {
        viewMonth = 0;
        viewYear++;
      }
      render();
    });

    function goToday() {
      viewYear = today.getFullYear();
      viewMonth = today.getMonth();
      render();
    }

    document.querySelectorAll('.mode-button').forEach(button => {
      button.addEventListener('click', () => {
        activeMode = button.dataset.mode;
        render();
      });
    });

    document.getElementById('month-label').addEventListener('click', goToday);
    document.getElementById('go-today').addEventListener('click', goToday);
    document.getElementById('today-action').addEventListener('click', () => toggleMark(todayValue));

    state = normalizeState(loadLocalState());
    render();
    initializeRemoteSync();
  </script>
</body>
</html>
